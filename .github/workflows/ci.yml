name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: |
          pytest
          python -m unittest discover -s plugins/finance-tools -p 'test_*.py'
      - name: Alembic schema drift
        if: matrix.python-version == '3.12'
        env:
          FASTCLAW_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm lint
      - name: Build web
        run: pnpm build
      - name: Verify attributed snapshot
        working-directory: .
        run: python scripts/verify_web_snapshot.py

  web-e2e:
    runs-on: ubuntu-latest
    needs: [quality, web]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Runtime and Web dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]"
          cd web
          pnpm install --frozen-lockfile
      - name: Build exported Web application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright Gateway acceptance
        env:
          FASTCLAW_E2E_PYTHON: python
        run: pnpm test:e2e
