name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: |
          pytest
          python -m unittest discover -s plugins/finance-tools -p 'test_*.py'
      - name: Alembic schema drift
        if: matrix.python-version == '3.12'
        env:
          FASTCLAW_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm lint
      - name: Build web
        run: pnpm build
      - name: Verify attributed snapshot
        working-directory: .
        run: python scripts/verify_web_snapshot.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fastclaw_test
          POSTGRES_USER: fastclaw
          POSTGRES_PASSWORD: fastclaw-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastclaw -d fastclaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: PostgreSQL integration
        env:
          FASTCLAW_POSTGRES_TEST_URL: postgresql+asyncpg://fastclaw:fastclaw-test-only@127.0.0.1:5432/fastclaw_test
        run: pytest -q -m postgres

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/verify_distribution.py dist
          python -m venv "${{ runner.temp }}/wheel-smoke"
          "${{ runner.temp }}/wheel-smoke/bin/pip" install dist/*.whl
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/wheel-smoke/bin/python" -c "from importlib.resources import files; import fastclaw; assert files('fastclaw').joinpath('bundled_plugins/finance-tools/plugin.json').is_file()"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build non-root Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fastclaw-python:ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency audit
        run: |
          python -m pip install -e ".[server]" pip-audit
          python -m pip_audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-e2e:
    runs-on: ubuntu-latest
    needs: [quality, web, postgres, package, docker, security]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Runtime and Web dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]"
          cd web
          pnpm install --frozen-lockfile
      - name: Build exported Web application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright Gateway acceptance
        env:
          FASTCLAW_E2E_PYTHON: python
        run: pnpm test:e2e
