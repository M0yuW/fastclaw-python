[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fastclaw"
version = "0.1.0"
description = "A Python runtime for FastClaw"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "FastClaw contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.21,<1.0",
  "alembic>=1.16,<2.0",
  "anyio>=4.10,<5.0",
  "asyncpg>=0.30,<1.0",
  "bcrypt>=4.3,<6.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0.43,<3.0",
  "typer>=0.16,<1.0",
]

[project.scripts]
fastclaw = "fastclaw.cli:app"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]
server = [
  "uvicorn>=0.35,<1.0",
]

[project.urls]
Homepage = "https://github.com/M0yuW/fastclaw-python"
Issues = "https://github.com/M0yuW/fastclaw-python/issues"
Repository = "https://github.com/M0yuW/fastclaw-python"

[tool.hatch.build.targets.wheel]
packages = ["src/fastclaw"]

[tool.hatch.build]
exclude = [
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/build",
  "/dist",
  "/web/.next",
  "/web/node_modules",
  "/web/out",
  "/web/playwright-report",
  "/web/test-results",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "fastclaw/alembic.ini"
"migrations" = "fastclaw/migrations"
"plugins/finance-tools/plugin.py" = "fastclaw/bundled_plugins/finance-tools/plugin.py"
"plugins/finance-tools/plugin.json" = "fastclaw/bundled_plugins/finance-tools/plugin.json"
"plugins/finance-tools/README.md" = "fastclaw/bundled_plugins/finance-tools/README.md"
"plugins/finance-tools/LICENSE" = "fastclaw/bundled_plugins/finance-tools/LICENSE"
"plugins/finance-tools/SOURCE.md" = "fastclaw/bundled_plugins/finance-tools/SOURCE.md"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: requires the dedicated FASTCLAW_POSTGRES_TEST_URL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC230"]
"plugins/finance-tools/*.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true
